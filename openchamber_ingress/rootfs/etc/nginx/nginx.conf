user nginx;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $request_method $request_uri $status $body_bytes_sent';
    access_log /dev/stdout main;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_origin $upstream_origin {
        default "https://openchamber.jklocal.us";
        '' "";
    }

    # Home Assistant forwards the browser's scheme. A direct LAN connection to
    # Home Assistant sends no such header, so the session cookie must not be
    # marked Secure or the browser discards it and the panel cannot stay
    # signed in.
    map $http_x_forwarded_proto $browser_scheme {
        default $http_x_forwarded_proto;
        '' "http";
    }

    server {
        listen 8099;
        server_name _;

        allow 127.0.0.1;
        allow 172.30.32.2;
        deny all;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /_oc_ingress_shim.js {
            root /www;
            add_header Cache-Control "no-store" always;
        }

        location / {
            proxy_pass https://192.168.0.18;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name openchamber.jklocal.us;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 4;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

            proxy_set_header Host openchamber.jklocal.us;
            proxy_set_header Origin $upstream_origin;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $browser_scheme;
            proxy_cookie_path / /api/hassio_ingress/;

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            proxy_set_header Accept-Encoding "";
            sub_filter_once off;
            sub_filter '<head>' '<head><base href="$http_x_ingress_path/"><script>window.__OPENCHAMBER_INGRESS_PATH__="$http_x_ingress_path";</script><script src="$http_x_ingress_path/_oc_ingress_shim.js"></script>';
            sub_filter 'src="/' 'src="';
            sub_filter 'href="/' 'href="';
        }
    }
}
